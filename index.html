<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>지역 유가 지도</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script defer src="data.js"></script>
  <script defer src="map.js"></script>
  <script defer src="boundaries/index.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top"><div class="wrap brand"><span class="brand-icon" aria-hidden="true">⛽</span> 지역 유가 지도</div></header>
  <main class="wrap">
    <section id="home" aria-labelledby="home-title">
      <div class="hero">
        <h1 id="home-title">우리 지역<br>주유소와 유가</h1>
        <p>지역별 데이터를 저장하거나 지도에서 주유소의 판매가격을 확인하세요.</p>
      </div>
      <div class="menu-grid">
        <button class="menu" data-open="extract"><span class="menu-icon" aria-hidden="true">▤</span><strong>지역 데이터 추출</strong><span>원하는 지역의 주유소와 판매가격을 각각 CSV로 저장합니다.</span></button>
        <button class="menu" data-open="lookup"><span class="menu-icon" aria-hidden="true">◎</span><strong>지도에서 주유소·유가 조회</strong><span>지도에서 주유소를 선택해 날짜별·유종별 가격을 확인합니다.</span></button>
      </div>
    </section>
    <section id="workflow" hidden>
      <button id="back" class="secondary">메인으로 돌아가기</button>
      <h1 id="title" tabindex="-1"></h1>
      <div class="panel">
        <div class="file-grid">
          <div class="file-box">
            <label for="stations">주유소 기본정보 CSV</label>
            <input id="stations" type="file" accept=".csv,text/csv" aria-describedby="stations-status">
            <p class="hint" id="stations-status" role="status">파일을 선택하세요.</p>
          </div>
          <div class="file-box">
            <label for="prices">주유소 판매가격 CSV</label>
            <input id="prices" type="file" accept=".csv,text/csv" aria-describedby="prices-status">
            <p class="hint" id="prices-status" role="status">파일을 선택하세요.</p>
          </div>
        </div>
        <div id="boundary-controls" hidden>
          <p id="boundary-status" role="status"></p>
          <div id="boundary-recovery" hidden>
            <button id="retry" class="secondary">경계 다시 불러오기</button>
            <label for="boundary-file">로컬 행정동 경계 파일 선택</label>
            <input id="boundary-file" type="file" accept=".geojson,.json" aria-describedby="boundary-status">
          </div>
        </div>
        <div class="filters">
          <div><label for="province">시·도</label><select id="province" disabled></select></div>
          <div><label for="district">시·군·구</label><select id="district" disabled></select></div>
        </div>
        <p id="summary" role="status">CSV 두 개를 선택하면 지역을 고를 수 있습니다.</p>
        <div id="exports" class="actions" hidden>
          <button id="save-stations" class="primary" disabled>주유소 CSV 저장</button>
          <button id="save-prices" class="secondary" disabled>판매가격 CSV 저장</button>
        </div>
      </div>
      <div id="lookup-result" class="lookup-grid" hidden>
        <section class="panel map-panel">
          <h2>주유소 지도</h2>
          <p id="map-note" class="hint" role="status"></p>
          <div id="map" aria-label="주유소 지도" tabindex="0">
            <canvas aria-hidden="true"></canvas>
            <div id="markers"></div>
            <div class="map-controls">
              <button id="zoom-in" aria-label="지도 확대">+</button>
              <button id="zoom-out" aria-label="지도 축소">−</button>
              <button id="reset-map" aria-label="지도 범위 초기화">⌂</button>
            </div>
          </div>
          <div class="legend"><span><i class="dot"></i>가격 연결</span><span><i class="dot muted"></i>연결된 가격 없음</span></div>
        </section>
        <section class="panel details">
          <h2>주유소 가격</h2>
          <div id="station-detail" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
